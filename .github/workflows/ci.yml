name: CI

on:
  push:
    branches:
       - main
  workflow_dispatch:

jobs:
  unit-test-backend:
     runs-on: ubuntu-latest
     steps:
     - uses: actions/checkout@v4

     - name: Set on Go
       uses: actions/setup-go@v4
       with:
         go-version: 1.21
         cache-dependencies-path: bugtracker-backend/go.sum

     - name: Execute backend unit tests
       working-directory: ./bugtracker-backend
       run: |
             go test -v ./... 

  unit-test-frontend:
    needs: unit-test-backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: bugtracker-frontend/package-lock.json

    - name: install node dependencies and execute frontend unit tests
      working-directory: ./bugtracker-frontend
      run: |
           npm ci
           npm test

    - name: upload frontend unit test results
      uses: actions/dorny/test-reporter@v1
      if: always()
      with:
        name: frontend-unit-report
        path: bugtracker-frontend/test-results.xml
        reporter: jest-junit

